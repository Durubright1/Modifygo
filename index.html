<body>

}

function snd(k){try{ax=ax||new(window.AudioContext||window.webkitAudioContext)();ax.resume();const t=ax.currentTime;
 if(k==='ding'){[880,1320].forEach((f,i)=>{const o=ax.createOscillator(),g=ax.createGain(),s=t+i*.09;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.2,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+.35);o.connect(g).connect(ax.destination);o.start(s);o.stop(s+.4)})}
 else{const n=Math.floor(ax.sampleRate*1.1),b=ax.createBuffer(1,n,ax.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=ax.createBufferSource(),f=ax.createBiquadFilter(),g=ax.createGain();s.buffer=b;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(6000,t+.9);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.25);g.gain.exponentialRampToValueAtTime(.0001,t+1);s.connect(f).connect(g).connect(ax.destination);s.start(t)}}catch(e){}}
const fx=$('#fx'),cx=fx.getContext('2d');let P=[],raf=0;
const dash=()=>({x:Math.random()*fx.width,y:Math.random()*fx.height,a:Math.random()*6.28,s:.1+Math.random()*.3,l:3+Math.random()*7,o:.2+Math.random()*.6});
function loop(){cx.clearRect(0,0,fx.width,fx.height);cx.lineCap='round';cx.lineWidth=1.6;
 P=P.filter(p=>{p.x+=Math.cos(p.a)*p.s;p.y+=Math.sin(p.a)*p.s;if(p.b){p.s*=1.045;p.l=p.s*5;p.o-=.011}
  cx.strokeStyle=`rgba(255,255,255,${Math.max(p.o,0)})`;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-Math.cos(p.a)*p.l,p.y-Math.sin(p.a)*p.l);cx.stroke();return p.o>0&&p.x>-99&&p.x<fx.width+99&&p.y>-99&&p.y<fx.height+99});
 if($('#inst').classList.contains('on'))raf=requestAnimationFrame(loop)}
function fxStart(){fx.width=innerWidth;fx.height=innerHeight;P=Array.from({length:55},dash);cancelAnimationFrame(raf);loop()}
function boom(){const x=fx.width/2,y=fx.height*.38;for(let i=0;i<120;i++)P.push({x,y,a:Math.random()*6.28,s:2+Math.random()*6,l:10,o:1,b:1})}
const ST=['Finding the fastest server','Downloading [n]','Unpacking files','Installing [n]','Wrapping up'],CUT=[.1,.55,.75,.93,1];
function install(id){
 const a=apps.find(x=>x.id===id);if(!a)return;const my=++run,o=$('#inst');
 const url=(/iP(hone|ad|od)/.test(navigator.userAgent)&&a.ios)||a.locker_url;
 try{ax=ax||new(window.AudioContext||window.webkitAudioContext)();ax.resume()}catch(e){}
 o.style.setProperty('--ac','#f59e0b');acc(a).then(c=>o.style.setProperty('--ac',c));
 $('#ig').src=$('#ic').src=a.image;$('#in').textContent=a.name;$('#il').textContent='Installing';$('#cont').hidden=true;
 $('#stp').innerHTML=ST.map(s=>`<li><i class="dot"></i>${esc(s.replace('[n]',a.name))}</li>`).join('');
 o.className='ov on';fxStart();
 const total=parseFloat(a.size)||55+Math.floor(Math.random()*60),D=a.duration*1000,t0=performance.now(),li=$$('#stp li');let sp=3,last=-1;
 (function f(t){
  if(my!==run)return;const p=Math.min(1,(t-t0)/D),k=p>=1?5:CUT.findIndex(c=>p<c);
  $('#ring').style.strokeDashoffset=590.6*(1-p);$('#iw').style.setProperty('--r',(1-p)*100+'%');
  $('#ip').textContent=Math.floor(p*100);sp=Math.max(.8,sp+(Math.random()-.5)*.9);
  $('#isp').textContent=sp.toFixed(1)+' MB/s';$('#imb').textContent=(total*p).toFixed(1)+' MB of '+total.toFixed(1)+' MB';
  if(k!==last){if(last>=0)snd('ding');last=k;li.forEach((e,j)=>e.className=j<k?'d':j===k?'cur':'')}
  if(p<1)return requestAnimationFrame(f);
  $('#il').textContent='Almost there';
  setTimeout(()=>{if(my!==run)return;snd('whoosh');o.classList.add('go');boom();
   setTimeout(()=>{if(my!==run)return;
    if(!/^https?:/.test(url||'')){$('#il').textContent='Download link not set yet.';return}
    if(a.after==='unlock'){$('#cont').href=url;$('#cont').hidden=false}else location.href=url},1500)},400);
 })(t0)}
