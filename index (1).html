<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Modifygo Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a12;--panel:#11131f;--line:#252a42;--tx:#e8eaf6;--mut:#8a90b4;--cy:#00e5ff;--mg:#ff3d8b;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(60% 40% at 90% -10%,#ff3d8b26,transparent),radial-gradient(50% 40% at 0 0,#00e5ff1f,transparent),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.5 system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 18px}
h1{margin:0;font:700 28px Rajdhani,system-ui,sans-serif;letter-spacing:.06em}
h1 span{font-size:13px;margin-left:8px;padding:2px 8px;border:1px solid var(--mg);color:var(--mg);border-radius:4px;vertical-align:middle}
h2{margin:0 0 12px;font:700 22px Rajdhani,system-ui,sans-serif}
.card,dialog{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--cy);border-radius:10px;padding:18px;color:var(--tx)}
.card{max-width:380px;margin:12vh auto 0}
label{display:block;margin-bottom:12px;color:var(--mut);font-size:13px}
input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:4px;padding:10px;background:#0b0d17;border:1px solid var(--line);border-radius:6px;color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border:1px solid var(--cy);background:var(--cy);color:#001014;border-radius:6px;font:700 15px Rajdhani,system-ui,sans-serif;letter-spacing:.03em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--cy)}.btn.danger{background:transparent;border-color:var(--mg);color:var(--mg)}.btn:disabled{opacity:.5}
.bar{display:flex;gap:10px}.bar input{margin:0}.bar .btn{white-space:nowrap}
.mut{color:var(--mut);font-size:13px}
.item{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.item img{width:48px;height:48px;object-fit:cover;border-radius:6px;background:#0b0d17;flex:none}
.meta{flex:1;min-width:0}.meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;margin-right:6px;padding:0 6px;border:1px solid var(--line);border-radius:4px;color:var(--mut);font-size:12px}.tag.f{border-color:var(--mg);color:var(--mg)}
.item .btn{padding:6px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 12px}.checks label{display:flex;gap:6px;align-items:center;margin:0;color:var(--tx)}
.acts{display:flex;gap:10px;justify-content:flex-end}
dialog{width:min(560px,94vw);max-height:92vh}dialog::backdrop{background:#000c}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);padding:10px 16px;background:var(--panel);border:1px solid var(--cy);border-radius:8px;opacity:0;pointer-events:none;transition:.2s;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{border-color:var(--mg)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style></head>
<body>
<main class="wrap">
<header><h1>MODIFYGO<span>admin</span></h1><button id="out" class="btn ghost" hidden>Log out</button></header>

<section id="login" hidden>
<form id="lf" class="card"><h2>Sign in</h2>
<label>Email<input id="em" type="email" autocomplete="username" required></label>
<label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
<button class="btn">Sign in</button></form>
</section>

<section id="app" hidden>
<div class="bar"><input id="q" type="search" placeholder="Search games"><button id="add" class="btn">Add game</button></div>
<p id="cnt" class="mut"></p><div id="list"></div>
</section>
</main>

<dialog id="dlg"><form id="gf">
<h2 id="dt">Add game</h2>
<label>Name<input id="f_name" required></label>
<div class="two"><label>Developer<input id="f_developer"></label>
<label>Category<select id="f_category"><option value="game">Game</option><option value="app">App</option><option value="modmenu">Mod menu</option></select></label></div>
<div class="two"><label>Rating<input id="f_rating"></label><label>Downloads<input id="f_downloads"></label></div>
<label>Download link (locker URL)<input id="f_locker_url" placeholder="https://"></label>
<label>Cover image URL<input id="f_image" placeholder="Paste a link, or upload below"></label>
<label>Upload cover (auto-compressed)<input id="up" type="file" accept="image/*"></label>
<div class="two"><label>Version<input id="f_version"></label><label>Size (e.g. 54 MB)<input id="f_size"></label></div>
<div class="two"><label>Badge text (e.g. Mod)<input id="f_badge"></label><label>Install animation (seconds)<input id="f_duration" type="number" min="3"></label></div>
<label>After the install animation<select id="f_after_install"><option value="unlock">Show unlock screen</option><option value="redirect">Go to the redirect URL</option></select></label>
<label>iOS redirect URL (optional)<input id="f_ios_url" placeholder="https://"></label>
<label>Background image URL<input id="f_bg_image" placeholder="Paste a link, or upload below"></label>
<label>Upload background (auto-compressed)<input id="upb" type="file" accept="image/*"></label>
<label>Description (HTML allowed)<textarea id="f_description" rows="6"></textarea></label>
<label>Screenshot URLs, one per line<textarea id="f_screenshots" rows="3"></textarea></label>
<label>Upload screenshots<input id="ups" type="file" accept="image/*" multiple></label>
<div class="checks"><label><input type="checkbox" id="f_is_mod"> Mod</label><label><input type="checkbox" id="f_is_mod_menu"> Mod menu</label><label><input type="checkbox" id="f_is_featured"> Featured</label><label><input type="checkbox" id="f_is_trending"> Trending</label></div>
<label>Sort order (lower shows first)<input id="f_sort_order" type="number"></label>
<div class="acts"><button type="button" id="cancel" class="btn ghost">Cancel</button><button class="btn" id="save">Save game</button></div>
</form></dialog>
<div id="toast" role="status"></div>

<script>
const SB='https://bvbokidxzluotarwmpki.supabase.co',KEY='sb_publishable_HRdccnw9NacJC6TltMxpCg_rR3-y1Wx',SITE='https://modifygo.online',BUCKET='game-images';
const $=s=>document.querySelector(s),F=['name','developer','category','rating','downloads','locker_url','image','description','sort_order','version','size','badge','bg_image','duration','after_install','ios_url'],CK=['is_mod','is_mod_menu','is_featured','is_trending'];
let S=JSON.parse(localStorage.getItem('mg_s')||'null'),games=[],editing=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=u=>/^https?:/.test(u||'')?u:SITE+'/'+String(u||'').replace(/^\//,'');
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'game';
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad show':'show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3500)}
function show(a){$('#login').hidden=a;$('#app').hidden=!a;$('#out').hidden=!a}
function logout(){S=null;localStorage.removeItem('mg_s');show(false)}
async function auth(body,grant){
 const r=await fetch(`${SB}/auth/v1/token?grant_type=${grant}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Sign in failed');
 S={t:j.access_token,r:j.refresh_token,e:Date.now()+(j.expires_in-60)*1000};localStorage.setItem('mg_s',JSON.stringify(S))}
async function api(path,o={}){
 if(S&&Date.now()>S.e){try{await auth({refresh_token:S.r},'refresh_token')}catch(e){logout();throw new Error('Session expired, sign in again')}}
 const r=await fetch(SB+path,{...o,headers:{apikey:KEY,...(S?{Authorization:'Bearer '+S.t}:{}),...o.headers}});
 if(r.status===401){logout();throw new Error('Session expired, sign in again')}
 if(!r.ok){let m;try{m=(await r.json()).message}catch(e){}throw new Error(m||'Request failed ('+r.status+')')}
 return (r.headers.get('content-type')||'').includes('json')?r.json():r.text()}
async function load(){games=await api('/rest/v1/games?select=*&order=sort_order.asc,created_at.desc');render()}
function render(){
 const q=$('#q').value.toLowerCase(),l=games.filter(g=>g.name.toLowerCase().includes(q));
 $('#cnt').textContent=`${l.length} of ${games.length} games`;
 $('#list').innerHTML=l.map(g=>`<div class="item"><img src="${esc(img(g.image))}" alt="" loading="lazy"><div class="meta"><b>${esc(g.name)}</b><span class="tag">${esc(g.category)}</span>${g.is_featured?'<span class="tag f">featured</span>':''}</div><button class="btn ghost" data-e="${esc(g.id)}">Edit</button><button class="btn danger" data-d="${esc(g.id)}">Delete</button></div>`).join('')||'<p class="mut">No games yet. Tap Add game to post your first one.</p>'}
function openForm(g){
 editing=g||null;$('#dt').textContent=g?'Edit game':'Add game';
 const d=g||{category:'game',rating:'4.5',downloads:'1M+',is_mod:true,version:'1.0.0',duration:22,after_install:'redirect',sort_order:Math.min(0,...games.map(x=>x.sort_order||0))-1};
 F.forEach(k=>$('#f_'+k).value=d[k]??'');CK.forEach(k=>$('#f_'+k).checked=!!d[k]);
 $('#f_screenshots').value=(d.screenshots||[]).join('\n');$('#dlg').showModal()}
function shrink(file,max){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('Image failed')),'image/webp',.82)};i.onerror=()=>no(new Error('That file is not an image'));i.src=URL.createObjectURL(file)})}
async function upload(file,dir,max){
 const b=await shrink(file,max),p=`${dir}/${slug($('#f_name').value||'img')}-${Date.now().toString(36)}.webp`;
 await api(`/storage/v1/object/${BUCKET}/${p}`,{method:'POST',headers:{'Content-Type':'image/webp'},body:b});
 return `${SB}/storage/v1/object/public/${BUCKET}/${p}`}
$('#lf').onsubmit=async e=>{e.preventDefault();try{await auth({email:$('#em').value,password:$('#pw').value},'password');$('#pw').value='';boot()}catch(x){toast(x.message,1)}};
$('#out').onclick=logout;$('#add').onclick=()=>openForm();$('#cancel').onclick=()=>$('#dlg').close();$('#q').oninput=render;
$('#list').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.e)openForm(games.find(g=>g.id===b.dataset.e));if(b.dataset.d)del(b.dataset.d)};
$('#up').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{toast('Uploading cover...');$('#f_image').value=await upload(f,'covers',900);toast('Cover uploaded')}catch(x){toast(x.message,1)}e.target.value=''};
$('#ups').onchange=async e=>{try{toast('Uploading screenshots...');const u=[];for(const f of e.target.files)u.push(await upload(f,'shots',1200));const t=$('#f_screenshots');t.value=(t.value.trim()?t.value.trim()+'\n':'')+u.join('\n');toast('Screenshots uploaded')}catch(x){toast(x.message,1)}e.target.value=''};
$('#upb').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{toast('Uploading background...');$('#f_bg_image').value=await upload(f,'backgrounds',1400);toast('Background uploaded')}catch(x){toast(x.message,1)}e.target.value=''};
$('#gf').onsubmit=async e=>{e.preventDefault();const b=$('#save');b.disabled=true;
 try{const r={};F.forEach(k=>r[k]=$('#f_'+k).value.trim());r.sort_order=parseInt(r.sort_order)||0;r.duration=parseInt(r.duration)||22;
 r.screenshots=$('#f_screenshots').value.split('\n').map(s=>s.trim()).filter(Boolean);CK.forEach(k=>r[k]=$('#f_'+k).checked);
 const s=slug(r.name);r.id=editing?editing.id:(games.some(g=>g.id===s)?s+'-'+Date.now().toString(36).slice(-4):s);
 await api('/rest/v1/games',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(r)});
 $('#dlg').close();toast('Game saved');await load()}catch(x){toast(x.message,1)}b.disabled=false};
async function del(id){const g=games.find(x=>x.id===id);if(!confirm(`Delete "${g.name}"? It will disappear from modifygo.online.`))return;
 try{await api('/rest/v1/games?id=eq.'+encodeURIComponent(id),{method:'DELETE'});toast('Game deleted');await load()}catch(x){toast(x.message,1)}}
async function boot(){if(!S)return show(false);show(true);try{await load()}catch(x){toast(x.message,1)}}
boot();
</script></body></html>
